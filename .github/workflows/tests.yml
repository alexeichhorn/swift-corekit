name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      # Lints only the folders that exist, since `Sources` and `Tests` arrive with the first feature.
      - run: swift format lint --strict --recursive $(ls -d Sources Tests 2>/dev/null) Package.swift

  # The library deploys on Linux, and route discovery reads an ELF section there instead of asking dyld.
  test:
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - run: swift build --build-tests
      - run: swift test
